name: S2S Integrity

on:
  pull_request:
    paths:
      - 'mi-app-deportiva/**'
      - '.github/workflows/s2s-integrity.yml'
  push:
    branches:
      - fix/runtime-recovery-data-integrity

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-app-deportiva
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mi-app-deportiva/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile backend
        run: python -m py_compile main.py calibration.py runtime_recovery.py integrity_app.py
      - name: Run integrity smoke tests
        env:
          DATABASE_URL: ''
          API_FOOTBALL_KEY: ''
        run: pytest -q test_integrity.py
