name: S2S heartbeat

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: s2s-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Keep Render awake without forcing data work
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --max-time 120 \
            --retry 2 \
            --retry-delay 10 \
            https://s2s-1-na3v.onrender.com/health \
            > /tmp/s2s-health.json
          python - <<'PY'
          import json
          with open('/tmp/s2s-health.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('status') == 'ok', data
          print({
              'status': data.get('status'),
              'boot_id': data.get('boot_id'),
              'uptime_seconds': data.get('uptime_seconds'),
              'catalog_date': data.get('catalog_date'),
              'catalog_size': data.get('catalog_size'),
              'analysis_running': data.get('analysis_running'),
              'scheduler': data.get('scheduler'),
          })
          PY
